<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#062e3f">
    <meta name="description" content="A dynamic and aesthetic To-Do List WebApp.">

    <!-- Google Font: Work Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Font Awesome (https://fontawesome.com) for icons; source: https://cdnjs.com/libraries/font-awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <link rel="icon" type="image/png" href="assets/favicon.png"/>
    <link rel="stylesheet" href="CSS/main.css">
    <link rel="stylesheet" href="CSS/corner.css">
    <title>JUST DO IT</title>
</head>

<body class="standard">
    <!-- GitHub corner (top left) -->
    <a href="https://github.com/Manuella-R/Manuella-RT-list" class="github-corner" aria-label="View source on GitHub">
        <svg width="80" height="80" viewBox="0 0 250 250" aria-hidden="true" style="fill:#151513; color:#fff; position: absolute; top: 0; border: 0; left: 0; transform: scale(-1, 1);">
            <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
            <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
            <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"></path>
        </svg>
    </a>

    <div id="header">
        <div class="flexrow-container" role="group" aria-label="Color theme">
            <button type="button" class="theme-selector standard-theme" data-theme="standard" aria-label="Standard theme" title="Standard theme"></button>
            <button type="button" class="theme-selector light-theme" data-theme="light" aria-label="Light theme" title="Light theme"></button>
            <button type="button" class="theme-selector darker-theme" data-theme="darker" aria-label="Darker theme" title="Darker theme"></button>
        </div>
        <h1 id="title">Just do it.</h1>
    </div>

    <p id="time"></p>
    <p id="date"></p>
    <p id="location"></p>

    <main id="app">
        <div id="form">
            <form class="todo-form" autocomplete="off">
                <div class="form-row">
                    <input class="todo-input" type="text" id="task-input" placeholder="Add a task." maxlength="200" aria-label="New task">
                    <button class="todo-btn" type="submit" aria-label="Add task"><i class="fa fa-thumbs-up" aria-hidden="true"></i></button>
                </div>
                <div class="form-meta">
                    <label class="meta-field">
                        <i class="fa-solid fa-tag" aria-hidden="true"></i>
                        <span class="sr-only">Category</span>
                        <input type="text" id="category-input" list="category-list" placeholder="Category (optional)" maxlength="24">
                    </label>
                    <label class="meta-field">
                        <i class="fa-regular fa-calendar" aria-hidden="true"></i>
                        <span class="sr-only">Due date</span>
                        <input type="date" id="due-input">
                    </label>
                </div>
                <datalist id="category-list"></datalist>
            </form>
        </div>

        <p id="status" role="status" aria-live="polite"></p>

        <section id="toolbar" aria-label="List tools">
            <div id="filters" aria-label="Filter by category" hidden></div>

            <div class="toolbar-row">
                <span id="counter" class="pill"></span>

                <div class="toolbar-actions">
                    <button type="button" class="btn" id="sort-due"><i class="fa-solid fa-arrow-down-short-wide" aria-hidden="true"></i> Sort by due date</button>
                    <button type="button" class="btn" id="clear-completed"><i class="fa-solid fa-broom" aria-hidden="true"></i> Clear completed</button>

                    <details class="menu" id="save-menu">
                        <summary class="btn"><i class="fa-solid fa-download" aria-hidden="true"></i> Save list</summary>
                        <div class="menu-panel">
                            <button type="button" data-action="txt"><i class="fa-solid fa-file-lines" aria-hidden="true"></i> Download as text (.txt)</button>
                            <button type="button" data-action="csv"><i class="fa-solid fa-file-csv" aria-hidden="true"></i> Download as spreadsheet (.csv)</button>
                            <button type="button" data-action="json"><i class="fa-solid fa-file-code" aria-hidden="true"></i> Download backup (.json)</button>
                            <button type="button" data-action="import"><i class="fa-solid fa-folder-open" aria-hidden="true"></i> Restore from backup…</button>
                        </div>
                    </details>
                </div>
            </div>
        </section>

        <div id="myUnOrdList">
            <ul class="todo-list"></ul>
        </div>
        <p id="empty" hidden></p>
    </main>

    <input type="file" id="import-input" accept=".json,application/json" hidden>

    <script src="JS/time.js"></script>
    <script src="JS/main.js"></script>
</body>
</html>
